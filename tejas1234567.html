<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .converter-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
            color: #333;
        }

        .btn-custom {
            width: 100%;
            background: #4facfe;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #007bff;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }

        @media (max-width: 576px) {
            .converter-box {
                padding: 20px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="converter-box">
        <h2>Currency Converter</h2>

        <div class="mb-3">
            <input type="number" id="amount" value="1" class="form-control" placeholder="Enter Amount">
        </div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <select id="fromCurrency" class="form-select">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="INR">INR</option>
                </select>
            </div>

            <div class="col-6">
                <select id="toCurrency" class="form-select">
                    <option value="INR">INR</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>
            </div>
        </div>

        <button class="btn btn-custom text-white" onclick="convert()">
            Convert
        </button>

        <p id="result">Result: --</p>
    </div>

    <script>
        function convert() {
            let amount = document.getElementById("amount").value;
            let from = document.getElementById("fromCurrency").value;
            let to = document.getElementById("toCurrency").value;

            const rates = {
                USD: 1,
                EUR: 0.92,
                INR: 83
            };

            let result = (amount / rates[from]) * rates[to];

            document.getElementById("result").innerText =
                `Result: ${result.toFixed(2)} ${to}`;
        }
    </script>

</body>
</html>
